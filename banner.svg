<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="blueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0044CC" />
      <stop offset="55%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#002B80" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" fill-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Latar Biru Elektrik & Pola Grid -->
  <rect width="1200" height="300" fill="url(#blueBg)" />
  <rect width="1200" height="300" fill="url(#dots)" />

  <!-- Potongan Diagonal Hitam & Aksen Varsity Putih-Navy -->
  <polygon points="760,0 1200,0 1200,300 640,300" fill="#090D16" />
  <polygon points="742,0 760,0 640,300 622,300" fill="#FFFFFF" />
  <polygon points="726,0 735,0 615,300 606,300" fill="#090D16" />

  <!-- Dekorasi Geometris Kanan -->
  <polygon points="940,45 1130,25 1095,255 880,235" fill="#0055FF" fill-opacity="0.22" />
  <polygon points="975,70 1105,55 1075,230 925,215" fill="none" stroke="#0066FF" stroke-width="3" />
  <text x="1015" y="155" font-family="Courier New, monospace" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">⟨/⟩</text>
  <text x="1015" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#66A3FF" text-anchor="middle" letter-spacing="4">CLASS OF 25</text>

  <!-- Tipografi Blok Gaya Referensi: R A E H A N -->
  <g transform="translate(115, 82)">
    <!-- R -->
    <rect x="0" y="4" width="64" height="68" fill="#090D16" transform="rotate(-3 32 38)" />
    <text x="32" y="53" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">R</text>
    <!-- A -->
    <rect x="72" y="0" width="64" height="68" fill="#FFFFFF" transform="rotate(2 104 34)" />
    <text x="104" y="49" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#090D16" text-anchor="middle">A</text>
    <!-- E -->
    <rect x="144" y="5" width="64" height="68" fill="#090D16" transform="rotate(-2 176 39)" />
    <text x="176" y="54" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">E</text>
    <!-- H -->
    <rect x="216" y="1" width="64" height="68" fill="#FFFFFF" transform="rotate(3 248 35)" />
    <text x="248" y="50" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#090D16" text-anchor="middle">H</text>
    <!-- A -->
    <rect x="288" y="5" width="64" height="68" fill="#090D16" transform="rotate(-2 320 39)" />
    <text x="320" y="54" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    <!-- N -->
    <rect x="360" y="0" width="64" height="68" fill="#FFFFFF" transform="rotate(2 392 34)" />
    <text x="392" y="49" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#090D16" text-anchor="middle">N</text>
  </g>

  <!-- Subjudul -->
  <rect x="115" y="172" width="335" height="32" fill="#090D16" />
  <text x="282" y="193" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">INFORMATICS DEVELOPER</text>
  <text x="115" y="228" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E0ECFF" letter-spacing="2">WEB • RESTFUL API • RELATIONAL DATABASE</text>
</svg>
