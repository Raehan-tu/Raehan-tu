<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 396" width="460" height="396">
  <!-- Frame Utama -->
  <rect x="2" y="2" width="456" height="392" rx="12" fill="#090D16" stroke="#0055FF" stroke-width="2" />

  <!-- Header HUD -->
  <rect x="2" y="2" width="456" height="32" rx="10" fill="#0F172A" />
  <line x1="2" y1="34" x2="458" y2="34" stroke="#0055FF" stroke-width="1.5" />
  <circle cx="20" cy="18" r="4.5" fill="#0066FF">
    <animate attributeName="fill" values="#0066FF;#FFFFFF;#0066FF" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="34" y="22" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1.5">
    TECH STACK // 9 MODULES
  </text>
  <text x="440" y="22" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#66A3FF" text-anchor="end">
    READY
  </text>

  <!-- ==================== BARIS 1 ==================== -->

  <!-- 1. C++ -->
  <g transform="translate(18, 48)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="0.0s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Hexagon C++ -->
    <polygon points="66,14 88,26 88,50 66,62 44,50 44,26" fill="#0055FF" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="66" y="43" font-family="Arial Black, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">C++</text>
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C++</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#0066FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.0s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 2. JAVASCRIPT -->
  <g transform="translate(164, 48)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon JS -->
    <rect x="44" y="16" width="44" height="44" rx="8" fill="#FFFFFF" />
    <text x="72" y="52" font-family="Arial Black, sans-serif" font-size="20" fill="#090D16" text-anchor="middle">JS</text>
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JAVASCRIPT</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 3. HTML5 -->
  <g transform="translate(310, 48)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="0.6s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Shield HTML5 -->
    <polygon points="46,16 86,16 82,53 66,60 50,53" fill="#0066FF" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="66" y="44" font-family="Arial Black, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HTML5</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#0066FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== BARIS 2 ==================== -->

  <!-- 4. CSS3 -->
  <g transform="translate(18, 162)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="0.9s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Shield CSS3 -->
    <polygon points="46,16 86,16 82,53 66,60 50,53" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.5" />
    <text x="66" y="44" font-family="Arial Black, sans-serif" font-size="19" fill="#090D16" text-anchor="middle">3</text>
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CSS3</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.9s" repeatCount="indefinite" />
    </rect>
