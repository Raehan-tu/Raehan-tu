  <!-- 5. NODE.JS -->
  <g transform="translate(164, 162)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="1.2s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Hexagon Node.js -->
    <polygon points="66,14 88,26 88,50 66,62 44,50 44,26" fill="#090D16" stroke="#0066FF" stroke-width="2.5" />
    <circle cx="66" cy="14" r="3" fill="#FFFFFF" />
    <circle cx="88" cy="50" r="3" fill="#FFFFFF" />
    <circle cx="44" cy="50" r="3" fill="#FFFFFF" />
    <text x="66" y="43" font-family="Arial Black, sans-serif" font-size="13" fill="#66A3FF" text-anchor="middle">NODE</text>
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NODE.JS</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#0066FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 6. MYSQL -->
  <g transform="translate(310, 162)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Silinder Database MySQL -->
    <ellipse cx="66" cy="22" rx="20" ry="6" fill="#0066FF" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 46,22 L 46,36 A 20,6 0 0 0 86,36 L 86,22" fill="#0055FF" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 46,36 L 46,50 A 20,6 0 0 0 86,50 L 86,36" fill="#090D16" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MYSQL</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== BARIS 3 ==================== -->

  <!-- 7. GIT -->
  <g transform="translate(18, 276)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Diamond Branch Git -->
    <rect x="49" y="21" width="34" height="34" rx="5" fill="#0066FF" transform="rotate(45 66 38)" />
    <circle cx="66" cy="27" r="3.5" fill="#FFFFFF" />
    <circle cx="66" cy="49" r="3.5" fill="#FFFFFF" />
    <circle cx="77" cy="38" r="3.5" fill="#FFFFFF" />
    <line x1="66" y1="27" x2="66" y2="49" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="66" y1="29" x2="77" y2="38" stroke="#FFFFFF" stroke-width="2.5" />
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GIT</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#0066FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 8. GITHUB -->
  <g transform="translate(164, 276)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="2.1s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Lingkaran & Siluet GitHub -->
    <circle cx="66" cy="38" r="22" fill="#FFFFFF" />
    <circle cx="66" cy="37" r="11" fill="#090D16" />
    <polygon points="56,29 58,21 63,27" fill="#090D16" />
    <polygon points="76,29 74,21 69,27" fill="#090D16" />
    <rect x="61" y="46" width="10" height="14" rx="4" fill="#090D16" />
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GITHUB</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="2.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 9. VS CODE -->
  <g transform="translate(310, 276)">
    <rect width="132" height="102" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.8">
      <animate attributeName="stroke" values="#1E293B;#0066FF;#FFFFFF;#0066FF;#1E293B" dur="4.5s" begin="2.4s" repeatCount="indefinite" />
    </rect>
    <!-- Ikon Ribbon VS Code -->
    <polygon points="76,16 86,21 86,55 76,60 48,38" fill="#0066FF" />
    <polygon points="48,26 54,22 76,44 76,60" fill="#66A3FF" />
    <polygon points="48,50 54,54 76,32 76,16" fill="#FFFFFF" />
    <text x="66" y="81" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VS CODE</text>
    <rect x="36" y="90" width="60" height="3" rx="1.5" fill="#0066FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="2.4s" repeatCount="indefinite" />
    </rect>
