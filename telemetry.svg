<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250">
  <rect x="2" y="2" width="1196" height="246" rx="10" fill="#090D16" stroke="#0055FF" stroke-width="2" />

  <rect x="2" y="2" width="1196" height="34" rx="8" fill="#0F172A" />
  <line x1="2" y1="36" x2="1198" y2="36" stroke="#0055FF" stroke-width="1.5" />
  <circle cx="22" cy="19" r="5" fill="#0066FF" />
  <circle cx="38" cy="19" r="5" fill="#FFFFFF" />
  <circle cx="54" cy="19" r="5" fill="#0066FF" />
  <text x="74" y="24" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    LIVE SYSTEM TELEMETRY // SKILL + RUNTIME ANALYTICS
  </text>
  <text x="1176" y="24" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#0066FF" text-anchor="end">
    SYNC: 100%
  </text>

  <!-- Cincin 1: DEV / SOFTWARE -->
  <g transform="translate(105, 132)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E293B" stroke-width="6" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#0066FF" stroke-width="6" stroke-dasharray="190 140" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="30 20">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">DEV</text>
    <text x="0" y="76" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#66A3FF" text-anchor="middle">SOFTWARE</text>
  </g>

  <!-- Cincin 2: SQL / DATABASE -->
  <g transform="translate(245, 132)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E293B" stroke-width="6" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="220 110" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#0066FF" stroke-width="2" stroke-dasharray="45 15">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-size="16" fill="#0066FF" text-anchor="middle">SQL</text>
    <text x="0" y="76" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DATABASE</text>
  </g>

  <!-- Cincin 3: WEB / FRONTEND -->
  <g transform="translate(385, 132)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E293B" stroke-width="6" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#0066FF" stroke-width="6" stroke-dasharray="160 170" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="20 25">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="4s" repeatCount="indefinite" />
