    <text x="0" y="76" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#66A3FF" text-anchor="middle">FRONTEND</text>
  </g>

  <line x1="468" y1="52" x2="468" y2="230" stroke="#1E293B" stroke-width="2" />

  <!-- Osiloskop -->
  <g transform="translate(490, 56)">
    <rect x="0" y="0" width="320" height="145" rx="6" fill="#05080F" stroke="#1E293B" stroke-width="1.5" />
    <line x1="0" y1="36" x2="320" y2="36" stroke="#0F172A" stroke-width="1" />
    <line x1="0" y1="72" x2="320" y2="72" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="108" x2="320" y2="108" stroke="#0F172A" stroke-width="1" />
    <line x1="80" y1="0" x2="80" y2="145" stroke="#0F172A" stroke-width="1" />
    <line x1="160" y1="0" x2="160" y2="145" stroke="#0F172A" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="145" stroke="#0F172A" stroke-width="1" />

    <path d="M 10 72 Q 50 15, 90 72 T 170 72 T 250 72 T 310 72" fill="none" stroke="#0066FF" stroke-width="3">
      <animate attributeName="d" values="M 10 72 Q 50 15, 90 72 T 170 72 T 250 72 T 310 72;
                M 10 72 Q 50 130, 90 72 T 170 72 T 250 72 T 310 72;
                M 10 72 Q 50 15, 90 72 T 170 72 T 250 72 T 310 72" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path d="M 10 72 Q 50 125, 90 72 T 170 72 T 250 72 T 310 72" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.75">
      <animate attributeName="d" values="M 10 72 Q 50 125, 90 72 T 170 72 T 250 72 T 310 72;
                M 10 72 Q 50 20, 90 72 T 170 72 T 250 72 T 310 72;
                M 10 72 Q 50 125, 90 72 T 170 72 T 250 72 T 310 72" dur="2.4s" repeatCount="indefinite" />
    </path>

    <line x1="0" y1="0" x2="0" y2="145" stroke="#0066FF" stroke-width="2" opacity="0.8">
      <animate attributeName="x1" values="0;320;0" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;320;0" dur="3.2s" repeatCount="indefinite" />
    </line>

    <text x="160" y="168" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#66A3FF" text-anchor="middle" letter-spacing="1">
