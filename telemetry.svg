  <g transform="translate(855, 56)">
    <text x="0" y="12" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">NODE.JS + JAVASCRIPT</text>
    <text x="315" y="12" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#0066FF" text-anchor="end">ACTIVE</text>
    <rect x="0" y="18" width="315" height="12" rx="3" fill="#0F172A" stroke="#1E293B" />
    <rect x="2" y="20" width="275" height="8" rx="2" fill="#0066FF">
      <animate attributeName="width" values="40;280;265;280" dur="3.5s" repeatCount="indefinite" />
    </rect>

    <text x="0" y="54" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">MYSQL + RELATIONAL DB</text>
    <text x="315" y="54" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="end">ACTIVE</text>
    <rect x="0" y="60" width="315" height="12" rx="3" fill="#0F172A" stroke="#1E293B" />
    <rect x="2" y="62" width="260" height="8" rx="2" fill="#FFFFFF">
      <animate attributeName="width" values="30;265;250;265" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <text x="0" y="96" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">C++ + DATA STRUCTURES</text>
    <text x="315" y="96" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#0066FF" text-anchor="end">ACTIVE</text>
    <rect x="0" y="102" width="315" height="12" rx="3" fill="#0F172A" stroke="#1E293B" />
    <rect x="2" y="104" width="245" height="8" rx="2" fill="#0066FF">
      <animate attributeName="width" values="50;250;235;250" dur="4.1s" repeatCount="indefinite" />
    </rect>

    <text x="0" y="138" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">HTML5 / CSS3 / UI DESIGN</text>
    <text x="315" y="138" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="end">ACTIVE</text>
    <rect x="0" y="144" width="315" height="12" rx="3" fill="#0F172A" stroke="#1E293B" />
    <rect x="2" y="146" width="285" height="8" rx="2" fill="#FFFFFF">
      <animate attributeName="width" values="60;290;275;290" dur="3.2s" repeatCount="indefinite" />
    </rect>

    <text x="157" y="175" font-family="Courier New, monospace" font-size="11" fill="#66A3FF" text-anchor="middle" letter-spacing="1">
      CONTINUOUS LEARNING ENGINE
    </text>
  </g>
</svg>
