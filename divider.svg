<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24">
  <line x1="20" y1="12" x2="1180" y2="12" stroke="#1E293B" stroke-width="2" />
  <line x1="600" y1="12" x2="1180" y2="12" stroke="#0066FF" stroke-width="3" stroke-dasharray="90 500" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="590" to="0" dur="2.2s" repeatCount="indefinite" />
  </line>
  <line x1="600" y1="12" x2="20" y2="12" stroke="#0066FF" stroke-width="3" stroke-dasharray="90 500" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="590" to="0" dur="2.2s" repeatCount="indefinite" />
  </line>
  <g transform="translate(600, 12)">
    <rect x="-7" y="-7" width="14" height="14" fill="#0066FF" stroke="#FFFFFF" stroke-width="2" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
