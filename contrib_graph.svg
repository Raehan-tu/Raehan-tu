<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#003399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <!-- Frame Utama -->
  <rect x="2" y="2" width="1196" height="336" rx="12" fill="#090D16" stroke="#0055FF" stroke-width="2" />

  <!-- Header Bar HUD -->
  <rect x="2" y="2" width="1196" height="36" rx="10" fill="#0F172A" />
  <line x1="2" y1="38" x2="1198" y2="38" stroke="#0055FF" stroke-width="1.5" />
  <circle cx="24" cy="20" r="5" fill="#0066FF">
    <animate attributeName="fill" values="#0066FF;#FFFFFF;#0066FF" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <text x="40" y="25" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    CONTRIBUTION TELEMETRY // 30-DAY ACTIVITY WAVE
  </text>
  <rect x="1010" y="9" width="170" height="22" rx="4" fill="#0055FF" />
  <text x="1095" y="24" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    PEAK: 17 COMMITS
  </text>

  <!-- Grid Horizontal & Label Sumbu Y -->
  <g font-family="Courier New, monospace" font-size="11" fill="#64748B" text-anchor="end">
    <line x1="75" y1="70" x2="1150" y2="70" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="64" y="74">18</text>

    <line x1="75" y1="133" x2="1150" y2="133" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="64" y="137">12</text>

    <line x1="75" y1="196" x2="1150" y2="196" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="64" y="200">6</text>

    <line x1="75" y1="260" x2="1150" y2="260" stroke="#1E293B" stroke-width="1.5" />
    <text x="64" y="264">0</text>
  </g>

  <!-- Bar Equalizer Latar untuk Hari Aktif -->
  <rect x="838" y="81" width="14" height="179" rx="3" fill="#0055FF" opacity="0.22">
    <animate attributeName="opacity" values="0.15;0.38;0.15" dur="2.4s" repeatCount="indefinite" />
  </rect>
  <rect x="912" y="249" width="14" height="11" rx="2" fill="#0055FF" opacity="0.25" />
  <rect x="986" y="228" width="14" height="32" rx="3" fill="#0055FF" opacity="0.25" />
  <rect x="1023" y="196" width="14" height="64" rx="3" fill="#0055FF" opacity="0.28" />
  <rect x="1060" y="91" width="14" height="169" rx="3" fill="#0055FF" opacity="0.22">
    <animate attributeName="opacity" values="0.38;0.15;0.38" dur="2.4s" repeatCount="indefinite" />
  </rect>

  <!-- Sapuan Laser Radar Melintasi Grafik -->
  <rect x="75" y="55" width="75" height="205" fill="url(#scanGrad)">
    <animate attributeName="x" values="75;1075;75" dur="6.5s" repeatCount="indefinite" />
  </rect>
  <line x1="150" y1="55" x2="150" y2="260" stroke="#0066FF" stroke-width="1.5" opacity="0.7">
    <animate attributeName="x1" values="150;1150;150" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="x2" values="150;1150;150" dur="6.5s" repeatCount="indefinite" />
  </line>

  <!-- Area Gradasi di Bawah Kurva -->
  <polygon points="105,260 142,260 179,260 216,260 253,260 290,260 327,260 364,260 401,260 438,260 475,260 512,260 549,260 586,260 623,260 660,260 697,260 734,260 771,260 808,260 845,81 882,260 919,249 956,260 993,228 1030,196 1067,91 1104,228 1141,260 1141,260 105,260" fill="url(#areaGrad)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
  </polygon>

  <!-- Garis Kurva Utama Electric Blue -->
  <polyline points="105,260 142,260 179,260 216,260 253,260 290,260 327,260 364,260 401,260 438,260 475,260 512,260 549,260 586,260 623,260 660,260 697,260 734,260 771,260 808,260 845,81 882,260 919,249 956,260 993,228 1030,196 1067,91 1104,228 1141,260" fill="none" stroke="#0066FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Kilatan Energi Putih Meluncur di Sepanjang Kurva -->
  <polyline points="105,260 142,260 179,260 216,260 253,260 290,260 327,260 364,260 401,260 438,260 475,260 512,260 549,260 586,260 623,260 660,260 697,260 734,260 771,260 808,260 845,81 882,260 919,249 956,260 993,228 1030,196 1067,91 1104,228 1141,260" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="120 1350" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="1470" to="0" dur="3.2s" repeatCount="indefinite" />
  </polyline>

  <!-- Sonar Pulse pada Puncak Tertinggi 1 (17 Commits) -->
  <circle cx="845" cy="81" r="6" fill="none" stroke="#0066FF" stroke-width="2">
    <animate attributeName="r" values="6;22;6" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <rect x="827" y="50" width="36" height="20" rx="4" fill="#0066FF" />
  <text x="845" y="64" font-family="Arial Black, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">17</text>

  <!-- Sonar Pulse pada Puncak Tertinggi 2 (16 Commits) -->
  <circle cx="1067" cy="91" r="6" fill="none" stroke="#FFFFFF" stroke-width="2">
    <animate attributeName="r" values="6;22;6" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
  </circle>
  <rect x="1049" y="60" width="36" height="20" rx="4" fill="#FFFFFF" />
  <text x="1067" y="74" font-family="Arial Black, sans-serif" font-size="11" fill="#090D16" text-anchor="middle">16</text>

  <!-- Titik Data Putih-Biru di Sepanjang Kurva -->
  <g fill="#FFFFFF" stroke="#0066FF" stroke-width="2.5">
    <circle cx="105" cy="260" r="3.5" />
    <circle cx="179" cy="260" r="3.5" />
    <circle cx="253" cy="260" r="3.5" />
    <circle cx="327" cy="260" r="3.5" />
    <circle cx="401" cy="260" r="3.5" />
    <circle cx="475" cy="260" r="3.5" />
    <circle cx="549" cy="260" r="3.5" />
    <circle cx="623" cy="260" r="3.5" />
    <circle cx="697" cy="260" r="3.5" />
    <circle cx="771" cy="260" r="3.5" />
    <circle cx="808" cy="260" r="4" />
    <circle cx="845" cy="81" r="5.5" />
    <circle cx="882" cy="260" r="4" />
    <circle cx="919" cy="249" r="4.5" />
    <circle cx="956" cy="260" r="4" />
    <circle cx="993" cy="228" r="4.5" />
    <circle cx="1030" cy="196" r="5" />
    <circle cx="1067" cy="91" r="5.5" />
    <circle cx="1104" cy="228" r="4.5" />
    <circle cx="1141" cy="260" r="3.5" />
  </g>

  <!-- Label Tanggal Sumbu X -->
  <g font-family="Courier New, monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
    <text x="105" y="282">22</text>
    <text x="179" y="282">24</text>
    <text x="253" y="282">26</text>
    <text x="327" y="282">28</text>
    <text x="401" y="282">30</text>
    <text x="475" y="282">1</text>
    <text x="549" y="282">3</text>
    <text x="623" y="282">5</text>
    <text x="697" y="282">7</text>
    <text x="771" y="282">9</text>
    <text x="808" y="282">14</text>
    <text x="845" y="282" fill="#0066FF" font-weight="bold">15</text>
    <text x="882" y="282">16</text>
    <text x="919" y="282">17</text>
    <text x="956" y="282">18</text>
    <text x="993" y="282">19</text>
    <text x="1030" y="282">20</text>
    <text x="1067" y="282" fill="#FFFFFF" font-weight="bold">21</text>
    <text x="1141" y="282">23</text>
  </g>

  <!-- Footer Status Bar -->
  <line x1="20" y1="298" x2="1180" y2="298" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="320" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#66A3FF" letter-spacing="1.5">
    STATUS: ACTIVE MOMENTUM
  </text>
  <text x="600" y="320" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    DAYS TIMELINE
  </text>
  <text x="1176" y="320" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0066FF" text-anchor="end" letter-spacing="1.5">
    RECENT SURGE: +25 COMMITS
  </text>
</svg>
